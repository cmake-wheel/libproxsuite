[build-system]
build-backend = "cmeel"
requires = [
  "cmeel-cereal",
  "cmeel-eigen",
  "cmeel-simde",
  "cmeel[build]",
  "jrl-cmakemodules"
]

[project]
version = "0.7.3"
description = "Quadratic Programming Solver for Robotics and beyond."
license = "BSD-2-Clause"
name = "libproxsuite"
readme = "README.md"
requires-python = ">= 3.10"

[project.urls]
homepage = "https://github.com/cmake-wheel/libproxsuite"
repository = "https://github.com/cmake-wheel/libproxsuite.git"
upstream = "https://github.com/Simple-robotics/proxsuite"

[tool.cmeel]
configure-args = [
  "-DBUILD_PYTHON_INTERFACE=OFF",
  "-DBUILD_TESTING=OFF",
  "-DBUILD_WITH_OPENMP_SUPPORT=OFF",
  "-DBUILD_WITH_VECTORIZATION_SUPPORT=ON",
  "-DCMAKE_OSX_DEPLOYMENT_TARGET=10.13",
  "-DINSTALL_DOCUMENTATION=OFF"
]
has-sitelib = false

[tool.ruff.lint]
ignore = ["E741"]
extend-select = ["W605"]
exclude = ["cmake-module/*", "bindings/python/external/nanobind/*"]
